    <!-- ── Schema.org JSON-LD — GEO/SEO Estructurado ────────
         Declara "Capará Holding" como Corporation con sus 3
         divisiones subsidiarias. Permite a Google, ChatGPT,
         Perplexity y otros motores de IA identificar la
         estructura del holding y sus dominios.
    ─────────────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Corporation",
      "name": "Capará Holding",
      "alternateName": "Marcela Capará Holding",
      "description": "Grupo empresarial de capitales privados orientado al desarrollo patrimonial integral, con operaciones en Real Estate corporativo, Inversiones patrimoniales y Seguros & Coberturas.",
      "url": "https://caparaholding.com",
      "logo": "https://caparaholding.com/logo.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Av. del Libertador 1234, Piso 10",
        "addressLocality": "Ciudad Autónoma de Buenos Aires",
        "addressRegion": "CABA",
        "addressCountry": "AR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "institucional@caparaholding.com",
        "telephone": "+54-011-4800-0000",
        "contactType": "customer service",
        "availableLanguage": "Spanish"
      },
      "subOrganization": [
        {
          "@type": "RealEstateAgent",
          "name": "Capará Real Estate",
          "description": "Comercialización de proyectos residenciales y corporativos premium. Desarrollos en pozo, proyectos llave en mano y propiedades exclusivas.",
          "url": "https://realestate.caparaholding.com",
          "areaServed": "Argentina"
        },
        {
          "@type": "FinancialService",
          "name": "Capará Inversiones",
          "description": "Fondos de inversión inmobiliaria, capital privado, pool de rentas y análisis de riesgo patrimonial con rentabilidad optimizada.",
          "url": "https://inversiones.caparaholding.com",
          "areaServed": "Argentina"
        },
        {
          "@type": "InsuranceAgency",
          "name": "Capará Seguros & Coberturas",
          "description": "Coberturas patrimoniales, salud y vida internacional, pólizas corporativas y planificación sucesoria fiduciaria.",
          "url": "https://seguros.caparaholding.com",
          "areaServed": "Argentina"
        }
      ]
    }
    </script>
  </head>
